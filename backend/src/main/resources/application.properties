spring.application.name=orbita-campus
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orbita_campus}
spring.datasource.username=${DB_USER:orbita}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
server.port=${PORT:8080}
server.error.include-message=never
server.forward-headers-strategy=none
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.health.mail.enabled=false
management.info.env.enabled=true
info.app.version=0.3.0-rc.1
campus.jwt-secret=${JWT_SECRET:}
campus.origins=${APP_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
campus.admin-email=${ADMIN_EMAIL:}
campus.admin-password=${ADMIN_PASSWORD:}
campus.verification-link=${VERIFICATION_LINK:http://localhost:5173/#cuenta}
campus.mail-from=${MAIL_FROM:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_TLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=4000
spring.mail.properties.mail.smtp.timeout=4000
spring.mail.properties.mail.smtp.writetimeout=4000
logging.pattern.level=%5p [solicitud:%X{solicitudId:-}]
