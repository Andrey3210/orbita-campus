name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiqueta:
        description: Etiqueta existente para publicar
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    env:
      VERSION_PUBLICADA: ${{ inputs.etiqueta || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.etiqueta || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verificar y empaquetar API
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Publicar contenedor
        env:
          TOKEN_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$VERSION_PUBLICADA" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION_PUBLICADA}"
          printf '%s' "$TOKEN_GHCR" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$imagen" backend
          docker push "$imagen"
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          argumentos=()
          if [[ "$VERSION_PUBLICADA" == *-* ]]; then argumentos+=(--prerelease); fi
          notas=docs/segundo-entregable.md
          if [[ -f docs/entrega-final.md ]]; then notas=docs/entrega-final.md; fi
          gh release create "$VERSION_PUBLICADA" --verify-tag "${argumentos[@]}" \
            --title "Órbita Campus $VERSION_PUBLICADA" --notes-file "$notas" \
            backend/target/orbita-campus-*.jar
