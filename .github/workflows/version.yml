name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Verificar y empaquetar API
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Publicar contenedor
        env:
          TOKEN_GHCR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          imagen="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
          printf '%s' "$TOKEN_GHCR" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" -t "$imagen" backend
          docker push "$imagen"
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          argumentos=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then argumentos+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${argumentos[@]}" \
            --title "Órbita Campus $GITHUB_REF_NAME" --notes-file docs/segundo-entregable.md \
            backend/target/orbita-campus-*.jar
