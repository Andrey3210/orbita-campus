name: Monitoreo de Órbita Campus

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disponibilidad:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Comprobar el portal y la API
        env:
          API_PUBLICA: ${{ vars.VITE_API_URL }}
        run: node calidad/monitoreo.mjs
      - name: Conservar evidencia de la comprobación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitoreo
          path: evidencia-monitoreo.json
          if-no-files-found: error
          retention-days: 14
