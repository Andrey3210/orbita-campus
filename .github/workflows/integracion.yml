name: Integración y pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-efimera
          MYSQL_DATABASE: orbita_campus
          MYSQL_USER: campus_ci
          MYSQL_PASSWORD: campus-ci-efimera
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysql --protocol=tcp -h 127.0.0.1 -ucampus_ci -pcampus-ci-efimera orbita_campus -e 'SELECT 1'"
          --health-interval=5s --health-timeout=5s --health-retries=25
    env:
      TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/orbita_campus
      TEST_DB_USER: campus_ci
      TEST_DB_PASSWORD: campus-ci-efimera
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Pruebas de HTTP sobre MySQL
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Compilar la imagen de la API
        run: docker build -t orbita-campus:ci backend
      - name: Guardar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pruebas-api
          path: backend/target/surefire-reports/
